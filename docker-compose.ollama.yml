# Ollama もコンテナで起動する場合:
# docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
services:
  openzeta:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-data:
