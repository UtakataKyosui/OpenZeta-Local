# OpenZeta — docker compose 用設定
#
#   1. このディレクトリに .env を作る (任意): GEMINI_API_KEY=xxxxx
#   2. docker compose up -d
#   3. http://localhost:3000 を開く
#
# .env が無くても起動できます (アプリ内 Settings で BYOK を設定)。
# 3000 番が埋まっている場合は HOST_PORT を変えてください:
#   HOST_PORT=3001 docker compose up -d

services:
  openzeta:
    build: .
    image: openzeta:latest
    # ローカル専用イメージなのでレジストリから pull しない
    pull_policy: build
    container_name: openzeta
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      # サーバー側の Gemini キー (任意)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # ホストで実行中の Ollama (Linux では下の host-gateway を使用)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
